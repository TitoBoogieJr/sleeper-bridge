name: Update Sleeper Snapshot

on:
  # Allows us to manually run the workflow from GitHub Actions
  workflow_dispatch:

  # Automatically run every 30 minutes
  schedule:
    - cron: "*/30 * * * *"

# Allow this workflow to commit updated JSON files back to the repo
permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. CHECK OUT THE REPOSITORY
      # ---------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source


      # ---------------------------------------------------------
      # 2. DOWNLOAD CURRENT LEAGUE DATA FROM SLEEPER
      # ---------------------------------------------------------
      - name: Fetch Sleeper data
        working-directory: source
        run: |
          set -e

          LEAGUE_ID="1313649397514391552"

          # Get the current NFL week from Sleeper
          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/state/nfl" \
            -o nfl-state.json

          WEEK=$(python3 -c "import json; print(json.load(open('nfl-state.json'))['week'])")

          echo "Current Sleeper NFL week: $WEEK"

          # Basic league information
          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID" \
            -o league.json

          # League members / managers
          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID/users" \
            -o users.json

          # Current rosters
          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID/rosters" \
            -o rosters.json

          # Current week's matchups
          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID/matchups/$WEEK" \
            -o matchups.json

          # -----------------------------------------------------
          # Download transactions for EVERY week so far.
          #
          # Previously we only downloaded the current week.
          # Keeping all weeks lets us analyze waiver history,
          # FAAB spending, adds, drops, etc.
          # -----------------------------------------------------

          mkdir -p transaction-weeks

          for TRANSACTION_WEEK in $(seq 1 "$WEEK"); do
            echo "Downloading transactions for Week $TRANSACTION_WEEK..."

            curl --fail --silent --show-error \
              "https://api.sleeper.app/v1/league/$LEAGUE_ID/transactions/$TRANSACTION_WEEK" \
              -o "transaction-weeks/week-$TRANSACTION_WEEK.json"
          done


      # ---------------------------------------------------------
      # 3. GET OUR CACHED SLEEPER PLAYER DATABASE
      # ---------------------------------------------------------
      #
      # players.yml downloads Sleeper's large player database
      # once per day and stores it on the snapshot-data branch.
      #
      # We reuse that cached copy here instead of downloading
      # the entire database every 30 minutes.
      # ---------------------------------------------------------
      - name: Get cached player database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch snapshot-data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            player-data

          cp player-data/players.json source/players.json


      # ---------------------------------------------------------
      # 4. BUILD OUR READABLE SNAPSHOT FILES
      # ---------------------------------------------------------
      - name: Build snapshots
        working-directory: source
        run: |
          python3 <<'PY'

          import json
          import glob
          import os

          from datetime import datetime, timezone


          # -----------------------------------------------------
          # Small helper for loading JSON files
          # -----------------------------------------------------
          def load(filename):
              with open(filename, "r", encoding="utf-8") as f:
                  return json.load(f)


          # Timestamp shared by all files generated in this run
          generated_at = datetime.now(timezone.utc).isoformat()


          # -----------------------------------------------------
          # Load the raw Sleeper data
          # -----------------------------------------------------
          nfl_state = load("nfl-state.json")
          league = load("league.json")
          users = load("users.json")
          rosters = load("rosters.json")
          matchups = load("matchups.json")
          players = load("players.json")

          current_week = nfl_state.get("week")


          # -----------------------------------------------------
          # USER LOOKUP
          #
          # Sleeper rosters reference managers by user ID.
          # This lets us quickly turn a user ID into a username
          # and team name.
          # -----------------------------------------------------
          user_lookup = {
              user["user_id"]: user
              for user in users
          }


          def manager_info(owner_id):

              owner = user_lookup.get(owner_id, {})
              metadata = owner.get("metadata") or {}

              username = owner.get("display_name")

              team_name = (
                  metadata.get("team_name")
                  or username
              )

              return {
                  "username": username,
                  "team_name": team_name,
              }


          # -----------------------------------------------------
          # PLAYER LOOKUP
          #
          # Sleeper normally gives us player IDs.
          # This translates those IDs into human-readable data.
          # -----------------------------------------------------
          def player_info(player_id):

              if not player_id:
                  return None

              player_id = str(player_id)

              player = players.get(player_id, {})

              full_name = player.get("full_name")

              if not full_name:
                  first = player.get("first_name", "")
                  last = player.get("last_name", "")
                  full_name = f"{first} {last}".strip()

              return {
                  "player_id": player_id,
                  "name": full_name or f"Unknown ({player_id})",
                  "position": player.get("position"),
                  "team": player.get("team"),
                  "status": player.get("status"),
                  "injury_status": player.get("injury_status"),

                  # Extra useful metadata for stash / keeper analysis
                  "age": player.get("age"),
                  "years_exp": player.get("years_exp"),
                  "search_rank": player.get("search_rank"),
                  "depth_chart_position": player.get(
                      "depth_chart_position"
                  ),
              }


          # -----------------------------------------------------
          # BUILD PLAYER OWNERSHIP MAP
          #
          # THIS IS IMPORTANT.
          #
          # Instead of searching for player names to determine
          # whether someone is rostered, we use Sleeper's unique
          # player IDs.
          #
          # This prevents false results like our Ollie Gordon
          # availability mistake.
          # -----------------------------------------------------
          ownership = {}

          readable_rosters = []

          for roster in rosters:

              owner_id = roster.get("owner_id")

              manager = manager_info(owner_id)

              player_ids = roster.get("players") or []
              starter_ids = roster.get("starters") or []
              reserve_ids = roster.get("reserve") or []

              # Convert IDs to strings so comparisons are consistent
              player_ids = [str(x) for x in player_ids]
              starter_ids = [str(x) for x in starter_ids]
              reserve_ids = [str(x) for x in reserve_ids]

              starter_set = set(starter_ids)
              reserve_set = set(reserve_ids)

              bench_ids = [
                  player_id
                  for player_id in player_ids
                  if player_id not in starter_set
                  and player_id not in reserve_set
              ]


              # Record exactly where every rostered player lives
              for player_id in player_ids:

                  if player_id in starter_set:
                      location = "starter"

                  elif player_id in reserve_set:
                      location = "reserve"

                  else:
                      location = "bench"

                  ownership[player_id] = {
                      "roster_id": roster.get("roster_id"),
                      "owner_user_id": owner_id,
                      "username": manager["username"],
                      "team_name": manager["team_name"],
                      "location": location,
                  }


              # Preserve our existing readable roster format
              readable_rosters.append({

                  "roster_id": roster.get("roster_id"),

                  "owner_user_id": owner_id,

                  "username": manager["username"],

                  "team_name": manager["team_name"],

                  "record": {
                      "wins": (
                          roster.get("settings") or {}
                      ).get("wins"),

                      "losses": (
                          roster.get("settings") or {}
                      ).get("losses"),

                      "ties": (
                          roster.get("settings") or {}
                      ).get("ties"),

                      "faab_used": (
                          roster.get("settings") or {}
                      ).get("waiver_budget_used"),
                  },

                  "starters": [
                      player_info(player_id)
                      for player_id in starter_ids
                  ],

                  "bench": [
                      player_info(player_id)
                      for player_id in bench_ids
                  ],

                  "reserve": [
                      player_info(player_id)
                      for player_id in reserve_ids
                  ],
              })


          # -----------------------------------------------------
          # BUILD LEAGUE PLAYER DATABASE
          #
          # This gives every fantasy-relevant player an explicit:
          #
          # rostered: true / false
          #
          # along with ownership information when applicable.
          # -----------------------------------------------------
          league_players = []


          # Positions we care about for normal fantasy analysis
          fantasy_positions = {
              "QB",
              "RB",
              "WR",
              "TE",
          }


          for player_id, player in players.items():

              position = player.get("position")

              # Ignore kickers, IDP players, etc.
              if position not in fantasy_positions:
                  continue

              # Ignore players who aren't attached to an NFL team
              if not player.get("team"):
                  continue


              info = player_info(player_id)

              owner = ownership.get(str(player_id))


              if owner:

                  info.update({
                      "rostered": True,
                      "roster_id": owner["roster_id"],
                      "owner_user_id": owner["owner_user_id"],
                      "username": owner["username"],
                      "team_name": owner["team_name"],
                      "location": owner["location"],
                  })

              else:

                  info.update({
                      "rostered": False,
                      "roster_id": None,
                      "owner_user_id": None,
                      "username": None,
                      "team_name": None,
                      "location": "free_agent",
                  })


              league_players.append(info)


          # -----------------------------------------------------
          # Sort players using Sleeper's search rank.
          #
          # Smaller search_rank numbers generally indicate
          # more fantasy-relevant / commonly searched players.
          #
          # Players without a rank go to the bottom.
          # -----------------------------------------------------
          league_players.sort(
              key=lambda p: (
                  p.get("search_rank") is None,
                  p.get("search_rank")
                  if p.get("search_rank") is not None
                  else 999999
              )
          )


          # -----------------------------------------------------
          # BUILD FREE AGENT LIST
          #
          # This is the file we'll use when asking:
          #
          # "Who should I stash?"
          #
          # Every player here is confirmed unrostered according
          # to Sleeper player ID.
          # -----------------------------------------------------
          free_agents = [
              player
              for player in league_players
              if not player["rostered"]
          ]


          # -----------------------------------------------------
          # LOAD ALL TRANSACTION WEEKS
          # -----------------------------------------------------
          transaction_history = []

          transaction_files = glob.glob(
              "transaction-weeks/week-*.json"
          )


          # Sort Week 1, Week 2, Week 3, etc. numerically
          transaction_files.sort(
              key=lambda filename: int(
                  os.path.basename(filename)
                  .replace("week-", "")
                  .replace(".json", "")
              )
          )


          for filename in transaction_files:

              week = int(
                  os.path.basename(filename)
                  .replace("week-", "")
                  .replace(".json", "")
              )

              transactions = load(filename)

              for transaction in transactions:

                  # Keep the week with the transaction so we
                  # know when the waiver/add/drop occurred.
                  transaction_copy = dict(transaction)

                  transaction_copy["week"] = week

                  transaction_history.append(
                      transaction_copy
                  )


          # -----------------------------------------------------
          # BUILD READABLE TRANSACTION HISTORY
          #
          # Raw Sleeper transactions use player IDs and roster IDs.
          # Here we translate those into player and manager names.
          # -----------------------------------------------------
          roster_lookup = {
              roster["roster_id"]: roster
              for roster in rosters
          }


          def roster_manager(roster_id):

              roster = roster_lookup.get(roster_id, {})

              owner_id = roster.get("owner_id")

              manager = manager_info(owner_id)

              return {
                  "roster_id": roster_id,
                  "owner_user_id": owner_id,
                  "username": manager["username"],
                  "team_name": manager["team_name"],
              }


          readable_transactions = []


          for transaction in transaction_history:

              adds = transaction.get("adds") or {}
              drops = transaction.get("drops") or {}

              readable_adds = []

              for player_id, roster_id in adds.items():

                  readable_adds.append({
                      "player": player_info(player_id),
                      "destination": roster_manager(roster_id),
                  })


              readable_drops = []

              for player_id, roster_id in drops.items():

                  readable_drops.append({
                      "player": player_info(player_id),
                      "source": roster_manager(roster_id),
                  })


              settings = transaction.get("settings") or {}


              readable_transactions.append({

                  "transaction_id": transaction.get(
                      "transaction_id"
                  ),

                  "week": transaction.get("week"),

                  "type": transaction.get("type"),

                  "status": transaction.get("status"),

                  "created": transaction.get("created"),

                  # Sleeper stores successful FAAB bid here
                  "faab": settings.get("waiver_bid"),

                  "adds": readable_adds,

                  "drops": readable_drops,

                  "roster_ids": transaction.get(
                      "roster_ids"
                  ) or [],
              })


          # -----------------------------------------------------
          # RAW SNAPSHOT
          #
          # Preserve the existing raw snapshot.
          # We now include the combined transaction history.
          # -----------------------------------------------------
          snapshot = {

              "snapshot_generated_at": generated_at,

              "nfl_state": nfl_state,

              "league": league,

              "users": users,

              "rosters": rosters,

              "matchups": matchups,

              "transactions": transaction_history,
          }


          # -----------------------------------------------------
          # READABLE LEAGUE SNAPSHOT
          # -----------------------------------------------------
          readable_snapshot = {

              "snapshot_generated_at": generated_at,

              "current_week": current_week,

              "league": {
                  "name": league.get("name"),
                  "season": league.get("season"),
                  "status": league.get("status"),
                  "total_rosters": league.get(
                      "total_rosters"
                  ),
              },

              "rosters": readable_rosters,
          }


          # -----------------------------------------------------
          # WRITE ALL GENERATED JSON FILES
          # -----------------------------------------------------

          with open(
              "league-snapshot.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(snapshot, f, indent=2)


          with open(
              "league-readable.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(readable_snapshot, f, indent=2)


          with open(
              "league-players-readable.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump({
                  "snapshot_generated_at": generated_at,
                  "players": league_players,
              }, f, indent=2)


          with open(
              "free-agents-readable.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump({
                  "snapshot_generated_at": generated_at,
                  "players": free_agents,
              }, f, indent=2)


          with open(
              "transactions-history.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  transaction_history,
                  f,
                  indent=2
              )


          with open(
              "transactions-readable.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump({
                  "snapshot_generated_at": generated_at,
                  "transactions": readable_transactions,
              }, f, indent=2)


          print(
              f"Created snapshots with "
              f"{len(league_players)} fantasy players, "
              f"{len(free_agents)} free agents, and "
              f"{len(readable_transactions)} transactions."
          )

          PY


      # ---------------------------------------------------------
      # 5. PUBLISH GENERATED DATA TO snapshot-data BRANCH
      # ---------------------------------------------------------
      - name: Publish snapshot to data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          git clone --branch snapshot-data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data \
          || {
            git clone \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

            cd data

            git checkout --orphan snapshot-data

            git rm -rf .

            cd ..
          }


          # Copy all generated snapshot files
          cp source/league-snapshot.json \
             data/league-snapshot.json

          cp source/league-readable.json \
             data/league-readable.json

          cp source/league-players-readable.json \
             data/league-players-readable.json

          cp source/free-agents-readable.json \
             data/free-agents-readable.json

          cp source/transactions-history.json \
             data/transactions-history.json

          cp source/transactions-readable.json \
             data/transactions-readable.json


          cd data


          git config user.name "SleeperBridge Bot"

          git config user.email \
            "sleeperbridge@users.noreply.github.com"


          # Stage our generated files
          git add \
            league-snapshot.json \
            league-readable.json \
            league-players-readable.json \
            free-agents-readable.json \
            transactions-history.json \
            transactions-readable.json


          # Only commit if something actually changed
          if git diff --cached --quiet; then

            echo "No snapshot changes to commit."

          else

            git commit -m \
              "Update Sleeper league snapshot"

            git push origin snapshot-data

          fi