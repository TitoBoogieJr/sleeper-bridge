name: Update Sleeper Snapshot

on:
  # Allows us to manually run the workflow from GitHub Actions
  workflow_dispatch:

  # Automatically run every 30 minutes
  schedule:
    - cron: "*/30 * * * *"

# Allow this workflow to commit updated JSON files back to the repo
permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. CHECK OUT THE REPOSITORY
      # ---------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source


      # ---------------------------------------------------------
      # 2. DOWNLOAD CURRENT LEAGUE DATA FROM SLEEPER
      # ---------------------------------------------------------
      - name: Fetch Sleeper data
        working-directory: source
        run: |
          set -e

          LEAGUE_ID="1313649397514391552"

          # Get the current NFL week
          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/state/nfl" \
            -o nfl-state.json

          WEEK=$(python3 -c "import json; print(json.load(open('nfl-state.json'))['week'])")

          echo "Current Sleeper NFL week: $WEEK"


          # Basic league information
          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID" \
            -o league.json


          # League managers
          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID/users" \
            -o users.json


          # Current rosters
          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID/rosters" \
            -o rosters.json


          # Current week's matchups
          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID/matchups/$WEEK" \
            -o matchups.json


          # -----------------------------------------------------
          # TRANSACTION HISTORY
          #
          # Download every week's transactions so we can analyze
          # waiver claims, FAAB spending, adds and drops.
          # -----------------------------------------------------
          mkdir -p transaction-weeks

          for TRANSACTION_WEEK in $(seq 1 "$WEEK"); do

            echo "Downloading transactions for Week $TRANSACTION_WEEK..."

            curl --fail --silent --show-error \
              "https://api.sleeper.app/v1/league/$LEAGUE_ID/transactions/$TRANSACTION_WEEK" \
              -o "transaction-weeks/week-$TRANSACTION_WEEK.json"

          done


          # -----------------------------------------------------
          # DRAFT DATA
          #
          # First get every draft associated with this league.
          #
          # Sleeper can technically return multiple drafts, so
          # we don't hard-code a draft ID.
          # -----------------------------------------------------
          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID/drafts" \
            -o drafts.json


          mkdir -p draft-picks


          # Extract each draft ID and download its picks.
          for DRAFT_ID in $(python3 - <<'PY'
          import json

          with open("drafts.json", "r", encoding="utf-8") as f:
              drafts = json.load(f)

          for draft in drafts:
              draft_id = draft.get("draft_id")

              if draft_id:
                  print(draft_id)
          PY
          ); do

            echo "Downloading picks for draft $DRAFT_ID..."

            curl --fail --silent --show-error \
              "https://api.sleeper.app/v1/draft/$DRAFT_ID/picks" \
              -o "draft-picks/$DRAFT_ID.json"

          done


      # ---------------------------------------------------------
      # 3. GET OUR CACHED SLEEPER PLAYER DATABASE
      # ---------------------------------------------------------
      #
      # players.yml downloads Sleeper's large NFL player database
      # once per day and saves it on snapshot-data.
      #
      # Reuse that copy here.
      # ---------------------------------------------------------
      - name: Get cached player database
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          git clone --depth 1 --branch snapshot-data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            player-data

          cp player-data/players.json source/players.json


      # ---------------------------------------------------------
      # 4. BUILD READABLE DATA FILES
      # ---------------------------------------------------------
      - name: Build snapshots
        working-directory: source

        run: |
          python3 <<'PY'

          import json
          import glob
          import os

          from datetime import datetime, timezone


          # -----------------------------------------------------
          # JSON LOADER
          # -----------------------------------------------------
          def load(filename):

              with open(filename, "r", encoding="utf-8") as f:
                  return json.load(f)


          generated_at = datetime.now(timezone.utc).isoformat()


          # -----------------------------------------------------
          # LOAD RAW SLEEPER DATA
          # -----------------------------------------------------
          nfl_state = load("nfl-state.json")
          league = load("league.json")
          users = load("users.json")
          rosters = load("rosters.json")
          matchups = load("matchups.json")
          players = load("players.json")
          drafts = load("drafts.json")

          current_week = nfl_state.get("week")


          # -----------------------------------------------------
          # USER LOOKUP
          #
          # Sleeper identifies managers by user ID.
          # This translates those IDs into readable names.
          # -----------------------------------------------------
          user_lookup = {

              user["user_id"]: user

              for user in users
          }


          def manager_info(owner_id):

              owner = user_lookup.get(
                  owner_id,
                  {}
              )

              metadata = owner.get("metadata") or {}

              username = owner.get("display_name")

              team_name = (
                  metadata.get("team_name")
                  or username
              )

              return {

                  "username": username,

                  "team_name": team_name,
              }


          # -----------------------------------------------------
          # PLAYER LOOKUP
          #
          # Converts a Sleeper player ID into readable player data.
          # -----------------------------------------------------
          def player_info(player_id):

              if not player_id:
                  return None


              player_id = str(player_id)

              player = players.get(
                  player_id,
                  {}
              )


              full_name = player.get("full_name")


              if not full_name:

                  first = player.get(
                      "first_name",
                      ""
                  )

                  last = player.get(
                      "last_name",
                      ""
                  )

                  full_name = (
                      f"{first} {last}".strip()
                  )


              return {

                  "player_id": player_id,

                  "name": (
                      full_name
                      or f"Unknown ({player_id})"
                  ),

                  "position":
                      player.get("position"),

                  "team":
                      player.get("team"),

                  "status":
                      player.get("status"),

                  "injury_status":
                      player.get("injury_status"),

                  "age":
                      player.get("age"),

                  "years_exp":
                      player.get("years_exp"),

                  "search_rank":
                      player.get("search_rank"),

                  "depth_chart_position":
                      player.get(
                          "depth_chart_position"
                      ),
              }


          # -----------------------------------------------------
          # BUILD DRAFT HISTORY
          # -----------------------------------------------------
          #
          # draft_history:
          #     Human-readable record of every draft pick.
          #
          # draft_lookup:
          #     Lets us instantly find the draft information for
          #     a specific player ID.
          #
          # This is important because keeper cost follows the
          # PLAYER even if that player is later traded.
          # -----------------------------------------------------

          draft_history = []

          draft_lookup = {}


          for draft in drafts:

              draft_id = str(
                  draft.get("draft_id")
              )

              season = draft.get("season")

              draft_type = draft.get("type")

              draft_status = draft.get("status")


              filename = (
                  f"draft-picks/{draft_id}.json"
              )


              if not os.path.exists(filename):
                  continue


              picks = load(filename)


              for pick in picks:

                  player_id = str(
                      pick.get("player_id")
                  )

                  roster_id = pick.get(
                      "roster_id"
                  )

                  picked_by = pick.get(
                      "picked_by"
                  )

                  metadata = (
                      pick.get("metadata")
                      or {}
                  )


                  manager = manager_info(
                      picked_by
                  )


                  # Sleeper stores keeper information inside
                  # the draft pick metadata.
                  is_keeper = bool(
                      metadata.get("is_keeper")
                  )


                  readable_pick = {

                      "draft_id":
                          draft_id,

                      "season":
                          season,

                      "draft_type":
                          draft_type,

                      "draft_status":
                          draft_status,

                      "player":
                          player_info(player_id),

                      "round":
                          pick.get("round"),

                      "pick_no":
                          pick.get("pick_no"),

                      "roster_id":
                          roster_id,

                      "picked_by_user_id":
                          picked_by,

                      "username":
                          manager["username"],

                      "team_name":
                          manager["team_name"],

                      "is_keeper":
                          is_keeper,
                  }


                  draft_history.append(
                      readable_pick
                  )


                  # Store draft information by player ID.
                  #
                  # This information stays attached to the player
                  # regardless of who currently owns him.
                  draft_lookup[player_id] = {

                      "draft_id":
                          draft_id,

                      "season":
                          season,

                      "round":
                          pick.get("round"),

                      "pick_no":
                          pick.get("pick_no"),

                      "original_roster_id":
                          roster_id,

                      "original_owner_user_id":
                          picked_by,

                      "original_username":
                          manager["username"],

                      "original_team_name":
                          manager["team_name"],

                      "is_keeper":
                          is_keeper,
                  }


          # -----------------------------------------------------
          # KEEPER RULES
          # -----------------------------------------------------
          #
          # YOUR LEAGUE RULES:
          #
          # 1. Round 1 players cannot be kept.
          #
          # 2. Round 2 players cannot be kept.
          #
          # 3. Players drafted in Rounds 3-14 can be kept at
          #    the SAME round the following season.
          #
          # 4. Undrafted players / waiver pickups / free agents
          #    can be kept for a Round 14 pick.
          #
          # 5. A player who was already used as a keeper THIS
          #    season cannot be kept again next season.
          #
          # 6. Keeper eligibility follows the PLAYER through
          #    trades. Trading him does not reset his draft cost.
          # -----------------------------------------------------

          def keeper_info(player_id):

              player_id = str(player_id)

              draft = draft_lookup.get(
                  player_id
              )


              # -------------------------------------------------
              # UNDRAFTED PLAYER
              #
              # No draft record means the player entered the
              # league through waivers / free agency.
              #
              # League rule:
              # keeper cost = Round 14.
              # -------------------------------------------------
              if not draft:

                  return {

                      "eligible_next_season": True,

                      "cost_round": 14,

                      "reason":
                          "Undrafted player; keeper cost is Round 14",
                  }


              draft_round = draft.get(
                  "round"
              )

              was_keeper = draft.get(
                  "is_keeper",
                  False
              )


              # -------------------------------------------------
              # ALREADY KEPT THIS SEASON
              #
              # A player cannot be kept in consecutive seasons.
              # -------------------------------------------------
              if was_keeper:

                  return {

                      "eligible_next_season": False,

                      "cost_round": None,

                      "reason":
                          "Already used as a keeper this season",
                  }


              # -------------------------------------------------
              # ROUND 1 OR ROUND 2
              #
              # These players are not keeper eligible.
              # -------------------------------------------------
              if draft_round in (1, 2):

                  return {

                      "eligible_next_season": False,

                      "cost_round": None,

                      "reason":
                          f"Drafted in Round {draft_round}; "
                          "Rounds 1 and 2 cannot be kept",
                  }


              # -------------------------------------------------
              # ROUND 3-14
              #
              # Eligible at original draft cost.
              # -------------------------------------------------
              return {

                  "eligible_next_season": True,

                  "cost_round": draft_round,

                  "reason":
                      f"Drafted in Round {draft_round}",
              }


          # -----------------------------------------------------
          # CURRENT PLAYER OWNERSHIP
          #
          # This maps every rostered player ID to his current
          # manager and roster location.
          #
          # Using IDs instead of names prevents false free-agent
          # results like our Ollie Gordon mistake.
          # -----------------------------------------------------

          ownership = {}

          readable_rosters = []


          for roster in rosters:

              owner_id = roster.get(
                  "owner_id"
              )

              manager = manager_info(
                  owner_id
              )


              player_ids = [

                  str(x)

                  for x in (
                      roster.get("players")
                      or []
                  )
              ]


              starter_ids = [

                  str(x)

                  for x in (
                      roster.get("starters")
                      or []
                  )
              ]


              reserve_ids = [

                  str(x)

                  for x in (
                      roster.get("reserve")
                      or []
                  )
              ]


              starter_set = set(
                  starter_ids
              )

              reserve_set = set(
                  reserve_ids
              )


              bench_ids = [

                  player_id

                  for player_id in player_ids

                  if player_id
                  not in starter_set

                  and player_id
                  not in reserve_set
              ]


              # Record exactly where each player currently lives.
              for player_id in player_ids:

                  if player_id in starter_set:

                      location = "starter"

                  elif player_id in reserve_set:

                      location = "reserve"

                  else:

                      location = "bench"


                  ownership[player_id] = {

                      "roster_id":
                          roster.get("roster_id"),

                      "owner_user_id":
                          owner_id,

                      "username":
                          manager["username"],

                      "team_name":
                          manager["team_name"],

                      "location":
                          location,
                  }


              # Existing human-readable roster.
              readable_rosters.append({

                  "roster_id":
                      roster.get("roster_id"),

                  "owner_user_id":
                      owner_id,

                  "username":
                      manager["username"],

                  "team_name":
                      manager["team_name"],

                  "record": {

                      "wins":
                          (
                              roster.get("settings")
                              or {}
                          ).get("wins"),

                      "losses":
                          (
                              roster.get("settings")
                              or {}
                          ).get("losses"),

                      "ties":
                          (
                              roster.get("settings")
                              or {}
                          ).get("ties"),

                      "faab_used":
                          (
                              roster.get("settings")
                              or {}
                          ).get(
                              "waiver_budget_used"
                          ),
                  },

                  "starters": [

                      player_info(player_id)

                      for player_id
                      in starter_ids
                  ],

                  "bench": [

                      player_info(player_id)

                      for player_id
                      in bench_ids
                  ],

                  "reserve": [

                      player_info(player_id)

                      for player_id
                      in reserve_ids
                  ],
              })


          # -----------------------------------------------------
          # BUILD LEAGUE PLAYER DATABASE
          # -----------------------------------------------------

          fantasy_positions = {

              "QB",
              "RB",
              "WR",
              "TE",
          }


          league_players = []


          for player_id, player in players.items():

              position = player.get(
                  "position"
              )


              # Ignore IDP, kickers, etc.
              if position not in fantasy_positions:
                  continue


              # Ignore players not currently attached
              # to an NFL team.
              if not player.get("team"):
                  continue


              player_id = str(
                  player_id
              )


              info = player_info(
                  player_id
              )


              owner = ownership.get(
                  player_id
              )


              draft = draft_lookup.get(
                  player_id
              )


              # -------------------------------------------------
              # CURRENT OWNERSHIP
              # -------------------------------------------------
              if owner:

                  info.update({

                      "rostered": True,

                      "roster_id":
                          owner["roster_id"],

                      "owner_user_id":
                          owner["owner_user_id"],

                      "username":
                          owner["username"],

                      "team_name":
                          owner["team_name"],

                      "location":
                          owner["location"],
                  })


              else:

                  info.update({

                      "rostered": False,

                      "roster_id": None,

                      "owner_user_id": None,

                      "username": None,

                      "team_name": None,

                      "location":
                          "free_agent",
                  })


              # -------------------------------------------------
              # ORIGINAL DRAFT INFORMATION
              #
              # This does NOT change after a trade.
              # -------------------------------------------------
              info["draft"] = draft


              # -------------------------------------------------
              # CALCULATED KEEPER INFORMATION
              # -------------------------------------------------
              info["keeper"] = keeper_info(
                  player_id
              )


              league_players.append(
                  info
              )


          # -----------------------------------------------------
          # SORT PLAYERS BY SLEEPER SEARCH RANK
          # -----------------------------------------------------

          league_players.sort(

              key=lambda p: (

                  p.get("search_rank")
                  is None,

                  p.get("search_rank")

                  if p.get("search_rank")
                  is not None

                  else 999999
              )
          )


          # -----------------------------------------------------
          # CONFIRMED FREE AGENTS
          # -----------------------------------------------------

          free_agents = [

              player

              for player in league_players

              if not player["rostered"]
          ]


          # -----------------------------------------------------
          # KEEPER VALUE DATABASE
          #
          # Only CURRENTLY ROSTERED players belong here.
          #
          # This gives us a compact file for questions like:
          #
          # "Who are my keeper options?"
          #
          # "What keeper assets does Karolyn have?"
          #
          # "Which trade targets have cheap keeper costs?"
          # -----------------------------------------------------

          keeper_players = [

              player

              for player in league_players

              if player["rostered"]
          ]


          # Group keeper information by current manager.
          keeper_teams = {}


          for player in keeper_players:

              roster_id = str(
                  player["roster_id"]
              )


              if roster_id not in keeper_teams:

                  keeper_teams[roster_id] = {

                      "roster_id":
                          player["roster_id"],

                      "owner_user_id":
                          player["owner_user_id"],

                      "username":
                          player["username"],

                      "team_name":
                          player["team_name"],

                      "players": [],
                  }


              keeper_teams[
                  roster_id
              ]["players"].append({

                  "player_id":
                      player["player_id"],

                  "name":
                      player["name"],

                  "position":
                      player["position"],

                  "nfl_team":
                      player["team"],

                  "location":
                      player["location"],

                  "draft":
                      player["draft"],

                  "keeper":
                      player["keeper"],
              })


          # -----------------------------------------------------
          # TRANSACTION HISTORY
          # -----------------------------------------------------

          transaction_history = []


          transaction_files = glob.glob(
              "transaction-weeks/week-*.json"
          )


          transaction_files.sort(

              key=lambda filename: int(

                  os.path.basename(filename)
                  .replace("week-", "")
                  .replace(".json", "")
              )
          )


          for filename in transaction_files:

              week = int(

                  os.path.basename(filename)
                  .replace("week-", "")
                  .replace(".json", "")
              )


              transactions = load(
                  filename
              )


              for transaction in transactions:

                  transaction_copy = dict(
                      transaction
                  )

                  transaction_copy[
                      "week"
                  ] = week

                  transaction_history.append(
                      transaction_copy
                  )


          # -----------------------------------------------------
          # READABLE TRANSACTION HISTORY
          # -----------------------------------------------------

          roster_lookup = {

              roster["roster_id"]:
                  roster

              for roster in rosters
          }


          def roster_manager(roster_id):

              roster = roster_lookup.get(
                  roster_id,
                  {}
              )

              owner_id = roster.get(
                  "owner_id"
              )

              manager = manager_info(
                  owner_id
              )


              return {

                  "roster_id":
                      roster_id,

                  "owner_user_id":
                      owner_id,

                  "username":
                      manager["username"],

                  "team_name":
                      manager["team_name"],
              }


          readable_transactions = []


          for transaction in transaction_history:

              adds = (
                  transaction.get("adds")
                  or {}
              )

              drops = (
                  transaction.get("drops")
                  or {}
              )


              readable_adds = []


              for player_id, roster_id in adds.items():

                  readable_adds.append({

                      "player":
                          player_info(
                              player_id
                          ),

                      "destination":
                          roster_manager(
                              roster_id
                          ),
                  })


              readable_drops = []


              for player_id, roster_id in drops.items():

                  readable_drops.append({

                      "player":
                          player_info(
                              player_id
                          ),

                      "source":
                          roster_manager(
                              roster_id
                          ),
                  })


              settings = (
                  transaction.get("settings")
                  or {}
              )


              readable_transactions.append({

                  "transaction_id":
                      transaction.get(
                          "transaction_id"
                      ),

                  "week":
                      transaction.get("week"),

                  "type":
                      transaction.get("type"),

                  "status":
                      transaction.get("status"),

                  "created":
                      transaction.get("created"),

                  "faab":
                      settings.get(
                          "waiver_bid"
                      ),

                  "adds":
                      readable_adds,

                  "drops":
                      readable_drops,

                  "roster_ids":
                      transaction.get(
                          "roster_ids"
                      ) or [],
              })


          # -----------------------------------------------------
          # RAW SNAPSHOT
          # -----------------------------------------------------

          snapshot = {

              "snapshot_generated_at":
                  generated_at,

              "nfl_state":
                  nfl_state,

              "league":
                  league,

              "users":
                  users,

              "rosters":
                  rosters,

              "matchups":
                  matchups,

              "transactions":
                  transaction_history,

              "drafts":
                  drafts,

              "draft_picks":
                  draft_history,
          }


          # -----------------------------------------------------
          # READABLE LEAGUE SNAPSHOT
          # -----------------------------------------------------

          readable_snapshot = {

              "snapshot_generated_at":
                  generated_at,

              "current_week":
                  current_week,

              "league": {

                  "name":
                      league.get("name"),

                  "season":
                      league.get("season"),

                  "status":
                      league.get("status"),

                  "total_rosters":
                      league.get(
                          "total_rosters"
                      ),
              },

              "rosters":
                  readable_rosters,
          }


          # -----------------------------------------------------
          # WRITE GENERATED FILES
          # -----------------------------------------------------

          with open(
              "league-snapshot.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  snapshot,
                  f,
                  indent=2
              )


          with open(
              "league-readable.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  readable_snapshot,
                  f,
                  indent=2
              )


          with open(
              "league-players-readable.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump({

                  "snapshot_generated_at":
                      generated_at,

                  "players":
                      league_players,

              }, f, indent=2)


          with open(
              "free-agents-readable.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump({

                  "snapshot_generated_at":
                      generated_at,

                  "players":
                      free_agents,

              }, f, indent=2)


          with open(
              "transactions-history.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  transaction_history,
                  f,
                  indent=2
              )


          with open(
              "transactions-readable.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump({

                  "snapshot_generated_at":
                      generated_at,

                  "transactions":
                      readable_transactions,

              }, f, indent=2)


          # -----------------------------------------------------
          # DRAFT FILE
          # -----------------------------------------------------

          with open(
              "draft-readable.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump({

                  "snapshot_generated_at":
                      generated_at,

                  "drafts":
                      drafts,

                  "picks":
                      draft_history,

              }, f, indent=2)


          # -----------------------------------------------------
          # KEEPER VALUE FILE
          #
          # Organized by CURRENT owner.
          # -----------------------------------------------------

          with open(
              "keeper-value-readable.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump({

                  "snapshot_generated_at":
                      generated_at,

                  "keeper_rules": {

                      "minimum_draft_round": 3,

                      "undrafted_cost_round": 14,

                      "repeat_keepers_allowed":
                          False,

                      "keeper_cost":
                          "Original draft round",
                  },

                  "teams":
                      list(
                          keeper_teams.values()
                      ),

              }, f, indent=2)


          print(
              f"Created snapshots with "
              f"{len(league_players)} fantasy players, "
              f"{len(free_agents)} free agents, "
              f"{len(readable_transactions)} transactions, "
              f"{len(draft_history)} draft picks, "
              f"and {len(keeper_players)} rostered keeper records."
          )

          PY


      # ---------------------------------------------------------
      # 5. PUBLISH GENERATED FILES TO snapshot-data
      # ---------------------------------------------------------
      - name: Publish snapshot to data branch
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          git clone --branch snapshot-data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data \
          || {

            git clone \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

            cd data

            git checkout --orphan snapshot-data

            git rm -rf .

            cd ..
          }


          # Existing snapshot files
          cp source/league-snapshot.json \
             data/league-snapshot.json

          cp source/league-readable.json \
             data/league-readable.json

          cp source/league-players-readable.json \
             data/league-players-readable.json

          cp source/free-agents-readable.json \
             data/free-agents-readable.json

          cp source/transactions-history.json \
             data/transactions-history.json

          cp source/transactions-readable.json \
             data/transactions-readable.json


          # New draft / keeper files
          cp source/draft-readable.json \
             data/draft-readable.json

          cp source/keeper-value-readable.json \
             data/keeper-value-readable.json


          cd data


          git config user.name \
            "SleeperBridge Bot"

          git config user.email \
            "sleeperbridge@users.noreply.github.com"


          git add \
            league-snapshot.json \
            league-readable.json \
            league-players-readable.json \
            free-agents-readable.json \
            transactions-history.json \
            transactions-readable.json \
            draft-readable.json \
            keeper-value-readable.json


          if git diff --cached --quiet; then

            echo "No snapshot changes to commit."

          else

            git commit -m \
              "Update Sleeper league snapshot"

            git push origin snapshot-data

          fi