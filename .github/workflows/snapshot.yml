name: Update Sleeper Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Fetch Sleeper data
        working-directory: source
        run: |
          set -e

          LEAGUE_ID="1313649397514391552"

          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/state/nfl" \
            -o nfl-state.json

          WEEK=$(python3 -c "import json; print(json.load(open('nfl-state.json'))['week'])")

          echo "Current Sleeper NFL week: $WEEK"

          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID" \
            -o league.json

          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID/users" \
            -o users.json

          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID/rosters" \
            -o rosters.json

          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID/matchups/$WEEK" \
            -o matchups.json

          curl --fail --silent --show-error \
            "https://api.sleeper.app/v1/league/$LEAGUE_ID/transactions/$WEEK" \
            -o transactions.json

      - name: Build combined snapshot
        working-directory: source
        run: |
          python3 <<'PY'
          import json
          from datetime import datetime, timezone

          def load(filename):
              with open(filename, "r", encoding="utf-8") as f:
                  return json.load(f)

          snapshot = {
              "snapshot_generated_at": datetime.now(timezone.utc).isoformat(),
              "nfl_state": load("nfl-state.json"),
              "league": load("league.json"),
              "users": load("users.json"),
              "rosters": load("rosters.json"),
              "matchups": load("matchups.json"),
              "transactions": load("transactions.json"),
          }

          with open("league-snapshot.json", "w", encoding="utf-8") as f:
              json.dump(snapshot, f, indent=2)

          print("Combined Sleeper snapshot created.")
          PY

      - name: Publish snapshot to data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch snapshot-data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data \
          || {
            git clone \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
            cd data
            git checkout --orphan snapshot-data
            git rm -rf .
            cd ..
          }

          cp source/league-snapshot.json data/league-snapshot.json

          cd data

          git config user.name "SleeperBridge Bot"
          git config user.email "sleeperbridge@users.noreply.github.com"

          git add league-snapshot.json

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Update Sleeper league snapshot"
            git push origin snapshot-data
          fi